services:
  # 1. Production Web Service (Node.js REST API + Native GnuCOBOL Execution Engine)
  - type: web
    name: smart-scholarship-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: scholarship-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@scholarship.edu
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  # 2. Production PostgreSQL Relational Database (Persistent Storage)
  - name: scholarship-db
    databaseName: scholarship_db
    user: postgres
    plan: starter
    region: oregon
